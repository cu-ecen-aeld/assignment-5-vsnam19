name: assignment-test
on:
    push:
        tags-ignore:
            - '*'
        branches:
            - '*'
jobs:
    unit-test:
        container: cuaesd/aesd-autotest:24-unit-test
        runs-on: self-hosted
        steps:
          - uses: actions/checkout@v4
          - name: Checkout submodules
            run: |
              find .git/modules -name "index.lock" -delete || true
              git submodule deinit -f --all || true
              rm -rf .git/modules/buildroot buildroot
              git submodule sync --recursive
              git submodule update --init --force --recursive
          - name: Run unit test
            run: ./unit-test.sh
    full-test:
        container: cuaesd/aesd-autotest:24-assignment7-buildroot
        runs-on: self-hosted
        steps:
          - uses: actions/checkout@v4
          - name: Checkout submodules
            run: |
              find .git/modules -name "index.lock" -delete || true
              git submodule deinit -f --all || true
              rm -rf .git/modules/buildroot buildroot
              git submodule sync --recursive
              git submodule update --init --force --recursive
          - name: Run full test
            run: ./full-test.sh
